; PlatformIO project configuration for esp_8_bit_ng
; Mirrors the previous Arduino IDE board config:
;   esp32:esp32:esp32, PSRAM=disabled, PartitionScheme=default,
;   CPUFreq=240, FlashMode=qio, FlashFreq=80, FlashSize=4M

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino

board_build.partitions = default.csv
board_build.filesystem = spiffs
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L

monitor_speed = 115200
upload_speed = 921600
