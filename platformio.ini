; PlatformIO project configuration for esp_8_bit_ng
;
; Board config mirrors the previous Arduino IDE setup:
;   esp32:esp32:esp32, PSRAM=disabled, PartitionScheme=default,
;   CPUFreq=240, FlashMode=qio, FlashFreq=80, FlashSize=4M
;
; Pick which emulator/video-standard to build with -e, e.g.:
;   pio run -e atari-ntsc -t upload
;   pio run -e nes-pal -t upload
; default_envs below picks the one used when -e is omitted.
;
; Only one emulator ever links into a given firmware (see NewEmulator() in
; src/esp_8_bit.cpp), but PlatformIO's default src filter compiles every
; .c/.cpp under src/ for every environment regardless -- the other two
; vendored emulator cores just get discarded at link time. Each
; build_src_filter below scopes compilation to the one backend actually
; used, cutting build times and avoiding symbol collisions between the
; unrelated vendored codebases (atari800/nofrendo/smsplus) leaking across
; profiles that don't even use them.

[platformio]
default_envs = atari-ntsc

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino

board_build.partitions = default.csv
board_build.filesystem = spiffs
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L

monitor_speed = 115200
upload_speed = 921600

[filter_atari]
build_src_filter = +<*> -<emu_nofrendo.cpp> -<emu_smsplus.cpp> -<nofrendo/> -<smsplus/>

[filter_nes]
build_src_filter = +<*> -<emu_atari800.cpp> -<emu_smsplus.cpp> -<atari800/> -<smsplus/>

[filter_sms]
build_src_filter = +<*> -<emu_atari800.cpp> -<emu_nofrendo.cpp> -<atari800/> -<nofrendo/>

[env:atari-ntsc]
extends = filter_atari
build_flags = -D EMULATOR=EMU_ATARI -D VIDEO_STANDARD=NTSC

[env:atari-pal]
extends = filter_atari
build_flags = -D EMULATOR=EMU_ATARI -D VIDEO_STANDARD=PAL

[env:nes-ntsc]
extends = filter_nes
build_flags = -D EMULATOR=EMU_NES -D VIDEO_STANDARD=NTSC

[env:nes-pal]
extends = filter_nes
build_flags = -D EMULATOR=EMU_NES -D VIDEO_STANDARD=PAL

[env:sms-ntsc]
extends = filter_sms
build_flags = -D EMULATOR=EMU_SMS -D VIDEO_STANDARD=NTSC

[env:sms-pal]
extends = filter_sms
build_flags = -D EMULATOR=EMU_SMS -D VIDEO_STANDARD=PAL
